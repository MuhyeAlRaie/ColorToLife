<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#E3F2FF"/>
  <circle cx="330" cy="60" r="34" fill="#FFF6D6"/>
  <!-- robot -->
  <g stroke="#3A3357" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- antenna -->
    <line x1="200" y1="70" x2="200" y2="46"/>
    <circle cx="200" cy="40" r="9" fill="#FF8B7E"/>
    <!-- head -->
    <rect x="150" y="70" width="100" height="84" rx="20" fill="#9AC8FF"/>
    <!-- eyes -->
    <circle cx="178" cy="108" r="14" fill="#FFFFFF"/>
    <circle cx="222" cy="108" r="14" fill="#FFFFFF"/>
    <circle cx="178" cy="110" r="6" fill="#3A3357" stroke="none"/>
    <circle cx="222" cy="110" r="6" fill="#3A3357" stroke="none"/>
    <!-- smile -->
    <path d="M182 132 Q200 146 218 132" fill="none"/>
    <!-- body -->
    <rect x="156" y="166" width="88" height="76" rx="18" fill="#A9E8C8"/>
    <circle cx="200" cy="202" r="16" fill="#FFD93D"/>
    <!-- arms -->
    <path d="M150 184 Q126 196 132 218" fill="none"/>
    <path d="M250 184 Q274 196 268 218" fill="none"/>
    <!-- legs -->
    <line x1="178" y1="242" x2="178" y2="266"/>
    <line x1="222" y1="242" x2="222" y2="266"/>
  </g>
  <ellipse cx="200" cy="272" rx="64" ry="10" fill="#3A3357" opacity="0.12"/>
