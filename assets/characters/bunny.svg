<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F1EBFF"/>
  <circle cx="72" cy="56" r="28" fill="#FFF6D6"/>
  <!-- bunny -->
  <g stroke="#3A3357" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <ellipse cx="172" cy="66" rx="16" ry="44" fill="#FFFFFF" transform="rotate(-10 172 66)"/>
    <ellipse cx="228" cy="66" rx="16" ry="44" fill="#FFFFFF" transform="rotate(10 228 66)"/>
    <ellipse cx="172" cy="70" rx="7" ry="30" fill="#FFC9C4" stroke="none" transform="rotate(-10 172 70)"/>
    <ellipse cx="228" cy="70" rx="7" ry="30" fill="#FFC9C4" stroke="none" transform="rotate(10 228 70)"/>
    <!-- head -->
    <ellipse cx="200" cy="150" rx="62" ry="56" fill="#FFFFFF"/>
    <!-- eyes -->
    <circle cx="178" cy="142" r="7" fill="#3A3357" stroke="none"/>
    <circle cx="222" cy="142" r="7" fill="#3A3357" stroke="none"/>
    <circle cx="175.5" cy="139.5" r="2.2" fill="#FFFFFF" stroke="none"/>
    <circle cx="219.5" cy="139.5" r="2.2" fill="#FFFFFF" stroke="none"/>
    <!-- nose + mouth -->
    <path d="M194 156 L206 156 L200 164 Z" fill="#FF8B7E" stroke-width="4"/>
    <path d="M200 164 Q194 174 186 168" fill="none" stroke-width="4"/>
    <path d="M200 164 Q206 174 214 168" fill="none" stroke-width="4"/>
    <!-- cheeks -->
    <circle cx="158" cy="158" r="8" fill="#FFD9D5" stroke="none"/>
    <circle cx="242" cy="158" r="8" fill="#FFD9D5" stroke="none"/>
    <!-- body -->
    <ellipse cx="200" cy="228" rx="46" ry="36" fill="#FFFFFF"/>
    <ellipse cx="200" cy="236" rx="22" ry="18" fill="#C9B6F2" stroke-width="4"/>
    <!-- side paws -->
    <ellipse cx="160" cy="250" rx="14" ry="11" fill="#FFFFFF"/>
    <ellipse cx="240" cy="250" rx="14" ry="11" fill="#FFFFFF"/>
  </g>
  <ellipse cx="200" cy="270" rx="70" ry="10" fill="#3A3357" opacity="0.12"/>
</svg>
